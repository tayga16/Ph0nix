name: K750i internal storage
on:
  push:
    branches: [test/k750i-internal-storage]
    paths-ignore:
      - '.github/workflows/k750i-internal-storage.yml'
      - '.github/workflows/k750i-android-apk.yml'
      - 'frontends/android/**'
permissions:
  contents: read
jobs:
  cold-boot:
    if: >-
      github.repository == 'tayga16/Ph0nix' &&
      github.actor_id == '124491388' &&
      github.triggering_actor == 'tayga16'
    runs-on:
      - self-hosted
      - Linux
    timeout-minutes: 60
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Prepare the pinned DB2010 source
        run: |
          # Self-hosted checkout can reuse the submodule from a prior job.
          # Start from the pin when the prepared sources no longer match it.
          if ! python3 -m db2010.development.source check; then
            git submodule deinit -f -- qemu
            python3 -m db2010.development.source init
          fi
      - name: Test the Rust host
        run: cargo test --locked -p db2010-host -p k750-native
      - name: Build the pinned DB2010 engine
        run: |
          python3 -m venv build/k750i-test-tools
          tools="$PWD/build/k750i-test-tools/bin"
          "$tools/python" -m pip install meson==1.11.1 pytest==8.4.2
          export PATH="$tools:$PATH"
          if ! "$tools/python" -m db2010.development.build --configure --jobs 2; then
            find build/provenance/qemu -type f -name build.log -exec tail -n 80 {} \; || true
            exit 1
          fi
      - name: Verify that a rejected PMIC write leaves committed flash recoverable
        run: |
          build/k750i-test-tools/bin/python -m pytest -q \
            tests/test_i2c_handlers.py::test_i2c_transport_completion_and_private_peer_previews \
            tests/test_pmic_vibrator.py::test_pmic_fault_preserves_committed_internal_storage
      - name: Verify K750i internal storage across a cold boot
        run: |
          work="$(mktemp -d "$RUNNER_TEMP/ph0nix-k750i.XXXXXXXX")"
          trap 'rm -rf -- "$work"' EXIT
          python3 -m db2010.development.firmware init k750i --prefix --input-root "$work"
          firmware="$work/fw/k750i/images/R1DB001/cid49/sony-ericsson"
          export PH0NIX_TEST_LCD_DIR="$PWD/build/k750i-test-lcd"
          if ! cargo run --locked -p db2010-host --example phone-files-resume -- \
            "$PWD/qemu/build/qemu-system-arm" --fresh "$work/phone" \
            "$firmware/K750_R1DB001_MAIN_EU_1_CL_RED49.mbn" \
            "$firmware/K750_R1DB001_FS_EMEA_1_RED49.fbn"; then
            find "$work/phone" -type f -name engine.log -exec tail -n 80 {} \; || true
            python3 - "$work/phone" <<'PY' || true
          import base64
          import json
          from pathlib import Path
          import sys

          for path in Path(sys.argv[1]).rglob('failure-snapshot-chunks.json'):
              chunks = json.loads(path.read_text())
              snapshot = json.loads(b''.join(base64.b64decode(chunk['data_base64']) for chunk in chunks))
              print('Firmware registers:', json.dumps(snapshot.get('registers')))
              for key in ('stop', 'synthetic_etx', 'serial_transport', 'uart_bytes'):
                  print(f'{key}:', json.dumps(snapshot.get(key)))
              nor = snapshot.get('nor', {})
              print('NOR:', json.dumps({key: nor.get(key) for key in ('commands', 'operations', 'partitions')}))
              i2c = snapshot.get('i2c', {})
              i2c['captured_writes'] = i2c.get('captured_writes', [])[-8:]
              print('I2C at failure:', json.dumps(i2c))
          PY
            exit 1
          fi
      - name: Keep K750i boot screens on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: k750i-test-lcd
          path: build/k750i-test-lcd/*.ppm
          if-no-files-found: ignore
          retention-days: 3
